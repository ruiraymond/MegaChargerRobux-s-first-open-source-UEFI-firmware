<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TheChilledLemonium Browser</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #111827; color: #f9fafb; }
      .topbar { display: flex; gap: 8px; padding: 8px; background: #1f2937; border-bottom: 1px solid #374151; }
      input { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #4b5563; background: #0f172a; color: #f9fafb; }
      button { border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; background: #2563eb; color: white; }
      iframe { width: 100%; height: calc(100vh - 58px); border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <input id="urlInput" type="text" placeholder="Enter URL, e.g. openai.com" />
      <button id="goBtn">Go</button>
    </div>
    <iframe id="browserFrame" src="https://example.com" title="browser-frame"></iframe>
    <script src="./renderer.js"></script>
  </body>
</html>
